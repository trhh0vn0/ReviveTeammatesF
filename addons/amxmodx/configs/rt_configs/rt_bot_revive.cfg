// Enable automatic bot revive behaviour. 0 - disabled, 1 - enabled
// Default: "1"
// Minimum: "0"
// Maximum: "1"
rt_bot_enable "1"

// How often (in seconds) each living bot scans for a dead teammate to revive
// Default: "0.8"
// Minimum: "0.1"
rt_bot_think_interval "0.8"

// Multiplier applied to rt_search_radius when bots scan for corpses.
// 1.0 = same as human range; increase to let bots revive from farther away.
// Default: "1.0"
// Minimum: "0.1"
rt_bot_radius_mult "1.0"
